name: Verify current site and original media
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build && npm run check && node scripts/prepare-hosting.mjs
      - run: node scripts/check-v21-model.mjs && node scripts/check-v19-music.mjs && node scripts/check-assets.mjs && node scripts/check-v18-vr.mjs && node scripts/check-v17-ui.mjs && node scripts/check-v17-floors.mjs && node scripts/check-v16-assets.mjs && node scripts/check-v16-model.mjs
