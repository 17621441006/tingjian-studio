name: Verify restored dist (replaces obsolete anonymous live recovery)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: node scripts/check-assets.mjs
